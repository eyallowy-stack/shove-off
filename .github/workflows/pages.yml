# Publishes the game to GitHub Pages on every push to main. The service worker's version
# is stamped here, so phones that installed the game pick up each update. The source
# keeps VERSION = 'dev' (the room server stamps it live, and the tests expect 'dev').
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node tools/stamp-sw.mjs
      - name: Copy only the game's files
        run: |
          mkdir _site
          cp -R index.html manifest.webmanifest sw.js css icons js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
